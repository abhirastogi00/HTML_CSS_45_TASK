<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout - Task 41</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 20px;
            padding: 20px;
        }

        aside {
            background: #cbd5e1;
            padding: 20px;
            border-radius: 10px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 25px 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 6px #00000015;
        }

        footer {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* Breakpoint 1: Tablet */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 180px 1fr;
            }

            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Breakpoint 2: Mobile */
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                padding: 12px;
            }

            .products {
                grid-template-columns: 1fr;
            }

            header {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Responsive Website</h1>
        <p>Task 41 - Media Queries</p>
    </header>

    <div class="container">
        <aside>
            <h2>Sidebar</h2>
            <p>Home</p>
            <p>Products</p>
            <p>About Us</p>
            <p>Contact</p>
        </aside>

        <main class="products">
            <div class="card">
                <h3>Product 1</h3>
                <p>Price: ₹499</p>
            </div>

            <div class="card">
                <h3>Product 2</h3>
                <p>Price: ₹699</p>
            </div>

            <div class="card">
                <h3>Product 3</h3>
                <p>Price: ₹899</p>
            </div>

            <div class="card">
                <h3>Product 4</h3>
                <p>Price: ₹999</p>
            </div>

            <div class="card">
                <h3>Product 5</h3>
                <p>Price: ₹599</p>
            </div>

            <div class="card">
                <h3>Product 6</h3>
                <p>Price: ₹799</p>
            </div>
        </main>
    </div>

    <footer>
        <p>Responsive Design Practice</p>
    </footer>

</body>
</html>
