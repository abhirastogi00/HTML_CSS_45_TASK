<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Card Variants</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            width: 230px;
            padding: 20px;
        }

        .card-one {
            background: #dbeafe;
            border-radius: 5px;
        }

        .card-two {
            background: #d1fae5;
            border-radius: 20px;
        }

        .card-three {
            background: #fce7f3;
            border-radius: 40px;
        }

        h2 {
            color: #1e293b;
        }

        p {
            color: #475569;
        }
    </style>
</head>
<body>

    <h1>Three Card Variants</h1>

    <div class="container">
        <div class="card card-one">
            <h2>Basic Card</h2>
            <p>This card has a blue background and small rounded corners.</p>
        </div>

        <div class="card card-two">
            <h2>Modern Card</h2>
            <p>This card has a green background and medium rounded corners.</p>
        </div>

        <div class="card card-three">
            <h2>Soft Card</h2>
            <p>This card has a pink background and large rounded corners.</p>
        </div>
    </div>

</body>
</html>
