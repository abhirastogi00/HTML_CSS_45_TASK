<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar and Hero</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px 8%;
            background: #1e293b;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 35px;
            padding: 70px 8%;
            background: #e0f2fe;
        }

        .hero-content {
            flex: 1 1 300px;
        }

        .hero-content h1 {
            font-size: 42px;
            color: #0f172a;
            margin-top: 0;
        }

        .hero-content p {
            color: #475569;
            font-size: 18px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 10px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
        }

        .hero-image {
            flex: 1 1 250px;
            min-height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: #bfdbfe;
            font-size: 80px;
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .hero {
                flex-direction: column;
                align-items: stretch;
                padding: 45px 6%;
            }

            .hero-content h1 {
                font-size: 32px;
            }

            .hero-image {
                min-height: 180px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">MyWebsite</div>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main class="hero" id="home">
        <div class="hero-content">
            <h1>Build Your Future</h1>
            <p>
                Discover new ideas, learn useful skills,
                and take the next step toward your goals.
            </p>
            <a href="#about" class="btn">Get Started</a>
        </div>

        <div class="hero-image" aria-label="Creative workspace">
            💻
        </div>
    </main>

</body>
</html>
